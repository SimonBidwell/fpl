name: Update league json file
on:
  schedule:
    - cron: "0 1,12,18 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update_json:
    runs-on: ubuntu-latest
    env:
      league_id: 5944
      season: 2026-27
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.FPL_UPDATOR_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download and validate season data and lineups
        run: node scripts/update-season.mjs "$season" "$league_id"
      - name: Commit updated json file
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add "public/$season.json" "public/element-status-$season.json" "public/bootstrap-static-$season.json" "public/transactions-$season.json" "public/draft-choices-$season.json"
          if [ -d "public/$season/lineups" ]; then
            git add "public/$season/lineups"
          fi
          git diff --cached --quiet || git commit -m "Updated league json file"
          git push
